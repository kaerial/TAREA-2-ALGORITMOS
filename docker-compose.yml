services:
  db:
    image: pgrouting/pgrouting:latest
    container_name: ti2_postgis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: resiliencia_chile
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data

volumes:
  pgdata: